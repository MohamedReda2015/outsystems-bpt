name: Rule proposal
description: Propose a new BPT standard, best practice or checklist rule
labels: ["rule-proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong in OutSystems processes without this rule? (No client names or confidential details.)
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Proposed rule
      description: The rule, written as an instruction, plus one sentence on why it matters.
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Group
      options: [PAR - Placement and architecture, PDS - Process design, PHA - Human activities and tasks, PAA - Automatic activities, PLT - Light BPT, PEX - Errors and recovery, PVR - Versioning and deployment, POP - Operations and data, PSC - Security, PNM - Naming]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Suggested severity
      options: [Blocker, Major, Minor]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to official OutSystems documentation (preferred) or a community source (forum answer, Forge component, article).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Platform Server version(s)
      description: Where the behaviour was observed or documented.
  - type: dropdown
    id: platform
    attributes:
      label: Applies to
      multiple: true
      options: [Reactive Web, Mobile, Traditional Web, All O11, ODC Workflows]
