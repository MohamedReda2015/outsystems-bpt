name: Bug / inaccuracy
description: A rule or platform fact is wrong or outdated, or a script misbehaves
labels: ["bug"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File and rule ID (e.g. references/platform-reference.md §5, PAA-06) or script name.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong
      description: What it says now, what it should say, and the Platform Server version (and database) where you saw the behaviour.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: Link to official documentation, a product update, a forum answer, or a reproducible example.
  - type: textarea
    id: repro
    attributes:
      label: Script reproduction (if a script bug)
      description: The inventory JSON (with neutral names), the command and the output.
      render: shell
