name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checks
        run: |
          node scripts/check_skill.mjs
          node scripts/test_check_bpt.mjs

      - name: Tag matches SKILL.md version
        run: |
          v=$(sed -n 's/^  version: //p' SKILL.md)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "SKILL.md version v$v does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Build skill archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=outsystems-bpt/ -o "dist/outsystems-bpt-$GITHUB_REF_NAME.zip" HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
